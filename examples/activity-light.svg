<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="286" viewBox="0 0 1000 286" role="img" aria-labelledby="rf-activity-t rf-activity-d">
<title id="rf-activity-t">Contribution activity</title>
<desc id="rf-activity-d">Last 60 days · 614 contributions; peak 30</desc>
<style>svg{--bg1:#ffffff;--bg2:#f4f1fb;--border:#d0d7de;--title:#d6336c;--text:#1f2328;--muted:#656d76;--accent:#d6336c;--accent2:#6741d9;--track:#eaeef2;--grid:#eef0f3;}
text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif;fill:var(--text)}
.title{font-size:17px;font-weight:700;fill:var(--title)}
.sub{font-size:12px;fill:var(--muted)}
.label{font-size:12px;fill:var(--muted);letter-spacing:.3px}
.value{font-size:15px;font-weight:700;fill:var(--text);font-variant-numeric:tabular-nums}
.big{font-weight:800;fill:var(--text);font-variant-numeric:tabular-nums}
.fade{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.line{stroke-dasharray:1;stroke-dashoffset:0;animation:line 2s cubic-bezier(.4,.1,.2,1) .2s both}
@keyframes line{from{stroke-dashoffset:1}}
.area{animation:fadeUp 1s ease-out 1s both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}</style>
<defs>
<linearGradient id="rf-activity-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--bg1)"/><stop offset="1" style="stop-color:var(--bg2)"/></linearGradient>
<linearGradient id="rf-activity-stroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.55"/><stop offset=".35" style="stop-color:var(--border)"/><stop offset="1" style="stop-color:var(--accent2);stop-opacity:.55"/></linearGradient>
<linearGradient id="rf-activity-accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent2)"/></linearGradient>
<radialGradient id="rf-activity-glow" cx="1" cy="0" r="1"><stop offset="0" style="stop-color:var(--accent2);stop-opacity:.22"/><stop offset=".6" style="stop-color:var(--accent2);stop-opacity:0"/></radialGradient>
<radialGradient id="rf-activity-glow2" cx="0" cy="1" r=".9"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.12"/><stop offset=".6" style="stop-color:var(--accent);stop-opacity:0"/></radialGradient>
<clipPath id="rf-activity-clip"><rect width="984" height="270" rx="14"/></clipPath>
<linearGradient id="rf-activity-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.38"/><stop offset="1" style="stop-color:var(--accent2);stop-opacity:0"/></linearGradient>
<linearGradient id="rf-activity-line" gradientUnits="userSpaceOnUse" x1="58" y1="0" x2="956" y2="0"><stop offset="0" style="stop-color:var(--accent2)"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient>
